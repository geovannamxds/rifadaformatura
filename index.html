<style id="css">
:root{
  /* Layout: faixas de cor de ponta a ponta com rabiscos de fundo (verde no topo e no fim, creme em "como comprar", rosa em "se o seu número sair"); prêmios em carrossel; cartela de 50 números; painel em abas */
  --bg:#F5F1E8;--surface:#FFFDF8;--surface-2:#F8F4EC;--ink:#13241F;--muted:#55625B;--line:#DDD5C5;
  --hero:#173B33;--hero-ink:#FBF4E6;--hero-muted:#B9CCC3;--hatch-escuro:rgba(255,255,255,.04);--hatch-claro:rgba(19,36,31,.05);
  --paper:#FFF3DF;--paper-ink:#13241F;

  --accent:#CF4430;--accent-edge:#86261A;--accent-soft:#FBE0D9;--on-accent:#FFFFFF;
  --btn2:#FFF3DF;--btn2-edge:#13241F;--btn2-ink:#13241F;
  --taken:#E5E0D5;--taken-ink:#8F968F;--ok:#1B7650;--ok-edge:#0E4730;--on-ok:#FFFFFF;--ok-soft:#DCF0E4;--warn:#955807;--warn-soft:#FAEACD;

  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1513;--surface:#15201C;--surface-2:#1A2622;--ink:#E7EEE9;--muted:#9AA8A1;--line:#2C3A35;
  --hero:#123129;--hero-ink:#FBF4E6;--hero-muted:#A2B8AE;--hatch-escuro:rgba(255,255,255,.035);--hatch-claro:rgba(255,255,255,.035);
  --paper:#FFF1D9;--paper-ink:#13241F;
  --b-creme:#2A2317;--b-creme-ink:#F3EBDD;--b-rosa:#3A2326;--b-rosa-ink:#F6E7E5;--b-borda:#4A5A53;
  --accent:#F06A52;--accent-edge:#9A3322;--accent-soft:#3C201B;--on-accent:#1A0B07;
  --btn2:#FFF1D9;--btn2-edge:#040A08;--btn2-ink:#13241F;
  --taken:#1F2925;--taken-ink:#62716B;--ok:#58C996;--ok-edge:#2B7A55;--on-ok:#0B1F17;--ok-soft:#15302A;--warn:#E8A94F;--warn-soft:#382912;
  --scrim:rgba(0,0,0,.62);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1513;--surface:#15201C;--surface-2:#1A2622;--ink:#E7EEE9;--muted:#9AA8A1;--line:#2C3A35;
  --hero:#123129;--hero-ink:#FBF4E6;--hero-muted:#A2B8AE;--hatch-escuro:rgba(255,255,255,.035);--hatch-claro:rgba(255,255,255,.035);
  --paper:#FFF1D9;--paper-ink:#13241F;
  --b-creme:#2A2317;--b-creme-ink:#F3EBDD;--b-rosa:#3A2326;--b-rosa-ink:#F6E7E5;--b-borda:#4A5A53;
  --accent:#F06A52;--accent-edge:#9A3322;--accent-soft:#3C201B;--on-accent:#1A0B07;
  --btn2:#FFF1D9;--btn2-edge:#040A08;--btn2-ink:#13241F;
  --taken:#1F2925;--taken-ink:#62716B;--ok:#58C996;--ok-edge:#2B7A55;--on-ok:#0B1F17;--ok-soft:#15302A;--warn:#E8A94F;--warn-soft:#382912;
  --scrim:rgba(0,0,0,.62);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);color-scheme:dark}
html.travado{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance}
p{margin:0}
button{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.rot{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dica{font-size:.88rem;color:var(--muted)}
.erro{font-size:.88rem;color:var(--accent);font-weight:600}

/* ---------- faixas com rabiscos ---------- */
.banda{position:relative;overflow:hidden}
.banda>canvas.rabiscos{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.banda>.wrap{position:relative;z-index:1}
.hero,.banda-verde{background-color:var(--hero);background-image:repeating-linear-gradient(135deg,var(--hatch-escuro) 0 2px,transparent 2px 11px);color:var(--hero-ink)}
.banda-creme{background-color:var(--b-creme);background-image:repeating-linear-gradient(135deg,var(--hatch-claro) 0 2px,transparent 2px 11px);color:var(--b-creme-ink)}
.banda-rosa{background-color:var(--b-rosa);background-image:repeating-linear-gradient(135deg,var(--hatch-claro) 0 2px,transparent 2px 11px);color:var(--b-rosa-ink)}

/* ---------- topo ---------- */
.hero .wrap{padding-block:34px 44px;display:grid;gap:20px;justify-items:start}
.selo{display:inline-flex;align-items:center;padding:6px 14px;border:1.5px solid currentColor;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.hero .selo{color:var(--hero-ink);background:var(--hero)}
.hero h1{font-size:clamp(2.3rem,10.5vw,4.3rem);line-height:.98;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;max-width:11ch}
.hero h1 em{font-style:normal;color:var(--c5)}
.lede{font-size:1.04rem;max-width:32em;color:var(--hero-ink);opacity:.92;font-weight:300;white-space:pre-line}
.pilulas{display:flex;flex-wrap:wrap;gap:8px}
.pilula{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:.86rem;font-weight:600;line-height:1.2}
.pilula.mostarda{background:var(--c5);color:var(--on-c)}
.pilula.contorno{border:1.5px solid rgba(251,244,230,.55);color:var(--hero-ink);background:var(--hero)}
.canhoto{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:12px 20px 12px 24px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.canhoto::before,.canhoto::after{content:"";position:absolute;left:-10px;width:20px;height:20px;border-radius:50%;background:var(--hero)}
.canhoto::before{top:-10px}.canhoto::after{bottom:-10px}
.canhoto .rot{color:var(--paper-ink);opacity:.7}
.canhoto .preco{font-size:2.3rem;line-height:1;font-weight:800}
.canhoto-tx{display:grid;gap:2px;border-left:2px dashed rgba(19,36,31,.28);padding-left:14px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;padding-top:4px}

/* ---------- seções ---------- */
.secao{display:grid;gap:18px;padding-block:34px}
.secao h2{font-size:clamp(1.45rem,6vw,1.9rem);font-weight:800;line-height:1.08;text-transform:uppercase;letter-spacing:-.005em}
.secao h2 em{font-style:normal;color:var(--accent)}
.secao-cab{display:grid;gap:6px}

/* prêmios em carrossel */
.carrossel{display:grid;gap:14px}
.trilho{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 12px;overscroll-behavior-x:contain}
.trilho::-webkit-scrollbar{display:none}
.slide{flex:0 0 84%;scroll-snap-align:center;border-radius:24px;padding:16px 16px 20px;display:grid;gap:4px;align-content:start;color:var(--on-c);box-shadow:0 6px 0 rgba(19,36,31,.22)}
.slide img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover}
.slide-topo{display:flex;align-items:center;gap:10px}
.slide-pos{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.slide-tag{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--on-c);color:var(--paper);border-radius:999px;padding:4px 10px}
.slide-nome{font-size:1.3rem;font-weight:700;line-height:1.2}
@media (min-width:620px){.slide{flex-basis:45%}}
.carrossel-ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
.pontos{display:flex;gap:8px;align-items:center}
.ponto{width:10px;height:10px;border-radius:999px;border:0;background:var(--line);padding:0;cursor:pointer;transition:width .2s ease,background-color .2s ease}
.ponto[aria-current="true"]{width:28px;background:var(--accent)}

/* escolha */
.ferramentas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.busca{display:flex;gap:8px;flex:1 1 220px;min-width:0;align-items:center}
.busca input{flex:1;min-width:0}
.blocos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 8px;scrollbar-width:thin}
.bloco{flex:0 0 auto;scroll-snap-align:start;display:grid;gap:1px;justify-items:start;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.bloco .num{font-size:.9rem}
.bloco-info{font-size:.74rem;color:var(--muted)}
.bloco[aria-selected="true"]{background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.bloco[aria-selected="true"] .bloco-info{color:var(--hero-muted)}
.grade-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grade-titulo{font-weight:600}
.cartela{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
@media (min-width:620px){.cartela{grid-template-columns:repeat(10,minmax(0,1fr))}}
.cel{font-family:var(--f-display);font-weight:600;font-size:.86rem;letter-spacing:-.02em;height:46px;padding:0;min-width:0;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--line);transition:transform .08s ease,box-shadow .08s ease,background-color .12s ease}
.cel:hover{border-color:var(--ink)}
.cel:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.cel.sel{background:var(--accent);border-color:var(--accent-edge);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-edge)}
.cel.ocupado{background:var(--taken);border-color:transparent;color:var(--taken-ink);text-decoration:line-through;cursor:not-allowed;box-shadow:none}
.cel.pago{background:var(--ok-soft);border-color:transparent;color:var(--ok);box-shadow:none}
.cel.aguardando{background:var(--warn-soft);border-color:transparent;color:var(--warn);box-shadow:none}
.cel.pisca{animation:pisca 1.1s ease 2}
@keyframes pisca{50%{box-shadow:0 0 0 3px var(--accent)}}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.amostra{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface)}
.amostra.sel{background:var(--accent);border-color:var(--accent)}
.amostra.ocupado{background:var(--taken);border-color:transparent}
.amostra.pago{background:var(--ok-soft);border-color:var(--ok)}
.amostra.aguardando{background:var(--warn-soft);border-color:var(--warn)}
.aviso-breve{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:grid;gap:6px}
#area-grade{display:grid;gap:12px}

/* como comprar */
.cartoes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.cartoes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cartoes li{display:grid;grid-template-columns:40px 1fr;gap:2px 14px;align-items:center;background:var(--surface);color:var(--ink);border:2px solid var(--b-borda);border-radius:var(--r);padding:16px}
.bola{grid-row:span 2;align-self:center;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;font-size:1.05rem;background:var(--c5);color:var(--on-c);font-family:var(--f-display);font-weight:800}
.cartoes strong{font-weight:700;line-height:1.3;align-self:end}
.cartoes li>span:last-child{align-self:start}
.cartoes span:last-child{color:var(--muted);font-size:.93rem}

/* se ganhar */
.lede-g{opacity:.85}
.passos-g{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.passos-g li{display:grid;grid-template-columns:40px 1fr;gap:2px 12px}
.passos-g .bola{background:var(--c6);color:var(--on-c)}
.passos-g strong{font-weight:700}
.passos-g span:last-child{opacity:.85;font-size:.95rem}

/* dúvidas */
.faq{display:grid;gap:10px}
.faq details{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 16px}
.faq summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(var(--on-c),var(--on-c)) center/12px 2.5px no-repeat,linear-gradient(var(--on-c),var(--on-c)) center/2.5px 12px no-repeat,var(--c5);transition:transform .2s ease}
.faq details[open] summary::after{background:linear-gradient(var(--on-c),var(--on-c)) center/12px 2.5px no-repeat,var(--c5)}
.faq details p{padding:0 0 12px;color:var(--muted);font-weight:300}
.faq details p:last-child{padding-bottom:16px}
.faq details p strong{color:var(--ink);font-weight:600}
.linha-botoes{display:flex;flex-wrap:wrap;gap:12px}
.rodape .wrap{padding-block:22px 140px;color:var(--muted);font-size:.84rem;display:grid;gap:6px;font-weight:300}

/* botões em relevo e campos */
.btn{--face:var(--btn2);--edge:var(--btn2-edge);--txt:var(--btn2-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:2px solid var(--edge);background:var(--face);color:var(--txt);font:600 .95rem/1.1 var(--f-body);cursor:pointer;text-decoration:none;text-align:center;box-shadow:0 4px 0 var(--edge);transition:transform .08s ease,box-shadow .08s ease}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.primario{--face:var(--accent);--edge:var(--accent-edge);--txt:var(--on-accent)}
.btn.ok{--face:var(--ok);--edge:var(--ok-edge);--txt:var(--on-ok)}
.btn.peq{min-height:38px;padding:0 16px;font-size:.86rem;box-shadow:0 3px 0 var(--edge)}
.btn.peq:active{box-shadow:0 0 0 var(--edge)}
.btn.fantasma{background:transparent;box-shadow:none;border-color:var(--line);color:var(--ink)}
.btn.fantasma:active{transform:none}
.btn.perigo{color:var(--accent);border-color:var(--accent)}
.btn.largo{width:100%}
.btn.icone{width:40px;padding:0;font-size:1.2rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:none;cursor:pointer}
:is(.btn,.cel,.bloco,.aba,.link,.fechar,.ponto,summary,a):focus-visible,:is(input,select,textarea):focus-visible,.trilho:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.campo{display:grid;gap:6px}
.campo>label,.campo>.rotulo{font-weight:600;font-size:.92rem}
input[type=text],input[type=tel],input[type=search],input[type=email],select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:92px;resize:vertical}
.opcao{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.opcao input{width:20px;height:20px;accent-color:var(--accent)}
fieldset{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin:0;display:grid;gap:14px;background:var(--surface);min-width:0}
legend{font-family:var(--f-display);font-weight:700;padding:0 6px;font-size:1rem;text-transform:uppercase;letter-spacing:.02em}

/* barra fixa */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);box-shadow:var(--shadow);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.barra-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.barra-info{display:grid;line-height:1.2}
.barra-info .num{font-size:1.15rem}
.barra-acoes{display:flex;gap:10px;align-items:center}

/* folha (modal) */
.fundo{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.folha{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.folha:focus{outline:none}
@media (min-width:640px){.fundo{align-items:center}.folha{border-radius:24px}}
.folha-cab{display:grid;gap:12px;padding:20px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px))}
.folha-titulo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.folha-titulo h2{font-size:1.3rem;font-weight:800;text-transform:uppercase}
.fechar{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer;flex:none}
.folha-corpo{display:grid;gap:16px;padding:18px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.perfura{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-num{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1.5px dashed var(--muted);font-size:.92rem}
.chip-num button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:0 0 0 2px}
.total-linha{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total-linha .num{font-size:1.5rem}
.passos{list-style:none;margin:0;padding:0;display:grid;gap:18px;counter-reset:q}
.passos>li{counter-increment:q;display:grid;gap:8px;padding-left:42px;position:relative}
.passos>li::before{content:counter(q);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c5);color:var(--on-c);font-weight:800;font-family:var(--f-display)}
.passos h3{font-size:1.02rem;font-weight:700}
.copia{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;min-width:0}
.copia code{flex:1;min-width:0;font-family:var(--f-mono);font-size:.88rem;overflow-wrap:anywhere;word-break:break-all}
.copia code.cc{max-height:3.2em;overflow:hidden;font-size:.76rem;line-height:1.6em}
.copia-cc{display:grid;gap:8px;justify-items:start}
.cc-campo{width:100%;min-height:0!important;font-family:var(--f-mono)!important;font-size:.8rem!important;line-height:1.5;word-break:break-all;resize:none;padding:10px 12px}
.qr-pix{display:grid;justify-items:center;gap:10px;padding:16px;background:#FFFFFF;color:var(--paper-ink);border-radius:18px;border:1.5px solid var(--line);width:100%}
.qr-pix svg{display:block;width:min(230px,68vw);max-width:100%;height:auto}
.qr-pix p{font-size:.84rem;text-align:center;max-width:26em}
.nota{font-size:.88rem;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px}
.colar summary{cursor:pointer;font-weight:600;color:var(--accent)}
.colar[open]{display:grid;gap:10px}
.folha-rodape{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.zona-excluir{display:grid;gap:10px;border-top:1.5px solid var(--line);padding-top:14px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

/* faixa da dona na prévia */
.faixa-dona{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-size:.9rem;font-weight:600}

/* ---------- painel ---------- */
.adm{padding-block:22px 140px;display:grid;gap:18px}
.adm-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.adm-cab h1{font-size:1.7rem;font-weight:800;line-height:1.05;text-transform:uppercase}
.adm-acoes{display:flex;gap:10px;flex-wrap:wrap}
.aviso{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:14px 16px}
.aviso p{font-size:.9rem}
.aviso.alerta{background:var(--accent-soft)}
#avisos{display:grid;gap:10px}
#avisos:empty{display:none}
.resumo{background-color:var(--hero);background-image:repeating-linear-gradient(135deg,var(--hatch-escuro) 0 2px,transparent 2px 11px);color:var(--hero-ink);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.placar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.placar-n{font-size:3rem;line-height:1;font-weight:800}
.prog{display:flex;height:12px;border-radius:999px;background:rgba(251,244,230,.16);overflow:hidden}
.prog .p{background:var(--c4)}.prog .a{background:var(--c5)}
.legenda-prog{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--hero-muted)}
.legenda-prog i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.legenda-prog i.p{background:var(--c4)}.legenda-prog i.a{background:var(--c5)}.legenda-prog i.l{background:rgba(251,244,230,.3)}
.metricas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;border-top:1px solid rgba(251,244,230,.18);padding-top:12px}
.metricas dt{font-size:.76rem;color:var(--hero-muted)}
.metricas dd{margin:0;font-size:1.05rem}
.prazos{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:0 16px}
.prazos summary{cursor:pointer;padding:14px 0;font-weight:700}
.prazos ul{margin:0;padding:0 0 14px 18px;display:grid;gap:8px;font-size:.9rem}
.abas{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:16px}
.aba{flex:1;min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.aba[aria-selected="true"]{background:var(--hero);color:var(--hero-ink)}
#aba-corpo{display:grid;gap:14px}
.lista-topo{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lista-topo .busca-v{flex:1 1 220px;min-width:0}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtro{min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.84rem;cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lista{display:grid;gap:10px}
.venda{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.venda-topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.venda-nome{font-size:1.08rem;font-weight:700;font-family:var(--f-body)}
.venda-acoes{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700}
.pill.pago{background:var(--ok-soft);color:var(--ok)}
.pill.aguardando{background:var(--warn-soft);color:var(--warn)}
.vazio{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:6px;text-align:left}
.export{display:grid;gap:8px;justify-items:start;padding-top:6px}
.ajustes{display:grid;gap:16px}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.var{font-family:var(--f-mono);font-size:.78rem;padding:4px 9px;border-radius:999px;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.var:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.previa{display:grid;gap:6px;background:var(--ok-soft);border-radius:14px 14px 14px 4px;padding:12px 14px}
.previa p{white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere}
.aba{font-size:.88rem;padding:0 4px}
a.ig{color:inherit;font-weight:700;text-decoration:none}
.pilula.coral{background:var(--c6);color:var(--on-c)}
.aviso-reserva{background:var(--surface);color:var(--ink);border:2px dashed var(--b-borda);border-radius:var(--r);padding:14px 16px;font-size:.92rem}
.esgotou{display:grid;gap:10px;justify-items:start;background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:22px 20px;background-image:repeating-linear-gradient(135deg,var(--hatch-escuro) 0 2px,transparent 2px 11px)}
.esgotou h3{font-size:1.3rem;text-transform:uppercase}
.esgotou p{opacity:.9}
.esgotou-selo{background:var(--c5);color:var(--on-c);border-radius:999px;padding:6px 14px;font-weight:800}
.pill.vencida{background:var(--accent-soft);color:var(--accent)}
.blocos-prev{font-size:.84rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.banda-verde h2 em{color:var(--c5)}
.banda-rosa h2,.banda-creme h2{color:inherit}

/* ---------- rabiscos de fundo ---------- */
const FORMAS = {
  mola(g, s) { const n = 260, fim = Math.PI * 2 * 3.2; for (let i = 0; i <= n; i++) { const t = i / n * fim; const x = s * .3 * Math.cos(t), y = s * .055 * t + s * .2 * Math.sin(t); if (i) g.lineTo(x, y); else g.moveTo(x, y); } },
  laco(g, s) { const n = 220, a = -Math.PI * .6, b = Math.PI * 2.4; for (let i = 0; i <= n; i++) { const t = a + (b - a) * i / n; const x = s * .16 * t - s * .3 * Math.sin(t), y = -s * .3 * Math.cos(t) + s * .015 * t * t; if (i) g.lineTo(x, y); else g.moveTo(x, y); } },
  onda(g, s) { const n = 140; for (let i = 0; i <= n; i++) { const u = i / n; const x = s * u, y = s * .1 * Math.sin(u * Math.PI * 2 * 2.2); if (i) g.lineTo(x, y); else g.moveTo(x, y); } },
  zigue(g, s) { const n = 160; for (let i = 0; i <= n; i++) { const u = i / n; const x = s * u, y = s * .26 * Math.sin(u * Math.PI * 2 * 2.5); if (i) g.lineTo(x, y); else g.moveTo(x, y); } }
};
/* [forma, x (fração da largura), y (fração da altura), tamanho, giro, cor, espessura] */
const RABISCOS = {
  hero: [['mola', .94, .015, 92, .35, '--c5', 15], ['laco', .6, .94, 130, -.2, '--c2', 14], ['zigue', -.03, .995, 80, -.25, '--c6', 12]],
  creme: [['zigue', .86, .02, 90, .2, '--c6', 13], ['laco', -.03, .95, 120, .3, '--c4', 13]],
  rosa: [['mola', .97, .06, 70, -.3, '--c6', 13], ['onda', -.03, .99, 150, -.12, '--c2', 13]],
  verde: [['laco', .9, .06, 120, .5, '--c5', 14], ['zigue', .02, .99, 70, -.35, '--c3', 11]]
};
function desenharRabiscos() {
  const css = getComputedStyle(document.documentElement);
  $$('canvas.rabiscos').forEach(cv => {
    const lista = RABISCOS[cv.dataset.preset]; if (!lista) return;
    const box = cv.getBoundingClientRect(); if (!box.width || !box.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
    const g = cv.getContext('2d'); if (!g) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, box.width, box.height);
    g.lineCap = 'round'; g.lineJoin = 'round';
    const k = Math.min(1.7, Math.max(1, box.width / 420));
    lista.forEach(r => {
      g.save();
      g.translate(r[1] * box.width, r[2] * box.height);
      g.rotate(r[4]);
      g.strokeStyle = css.getPropertyValue(r[5]).trim() || '#FCBA59';
      g.lineWidth = r[6] * Math.min(k, 1.3);
      g.beginPath(); FORMAS[r[0]](g, r[3] * k); g.stroke();
      g.restore();
    });
  });
}

const CORES_PREMIO = ['#FEEAD1', '#61C4E1', '#F1BFC0', '#87B9A0', '#FCBA59'];
let carrosselTimer = null, irPremio = null, pausarCarrossel = () => {};
function htmlPremios() {

    '<div class="pontos">' + cfg.premios.map((p, i) => '<button type="button" class="ponto" data-ponto="' + i + '" aria-label="Ver o ' + (i + 1) + 'º prêmio"></button>').join('') + '</div>' +
    '<button type="button" class="btn peq icone" data-acao="prem-prox" aria-label="Próximo prêmio">›</button></div></div>';
}
function ligarCarrossel() {
  clearInterval(carrosselTimer); irPremio = null;
  const tr = $('#trilho'); if (!tr) return;
  const slides = $$('.slide', tr), pontos = $$('.ponto');
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let atual = 0, pausadoAte = 0, raf = null;
  const marcar = () => pontos.forEach((p, k) => p.setAttribute('aria-current', String(k === atual)));
  irPremio = (i, suave) => {
    atual = (i + slides.length) % slides.length;
    const s = slides[atual];
    tr.scrollTo({ left: s.offsetLeft - (tr.clientWidth - s.offsetWidth) / 2, behavior: suave && !reduz ? 'smooth' : 'auto' });
    marcar();
  };
  irPremio.atual = () => atual;
  pausarCarrossel = () => { pausadoAte = Date.now() + 8000; };
  tr.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const c = tr.scrollLeft + tr.clientWidth / 2; let best = 0, d = Infinity;
      slides.forEach((s, k) => { const dd = Math.abs(s.offsetLeft + s.offsetWidth / 2 - c); if (dd < d) { d = dd; best = k; } });
      if (best !== atual) { atual = best; marcar(); }
    });
  }, { passive: true });
  ['pointerdown', 'touchstart', 'wheel', 'focusin', 'mouseenter'].forEach(ev => tr.addEventListener(ev, pausarCarrossel, { passive: true }));
  marcar();
  if (reduz) return;
  carrosselTimer = setInterval(() => {
    if (!document.body.contains(tr)) { clearInterval(carrosselTimer); return; }
    if (Date.now() < pausadoAte || document.hidden || ui.folha) return;
    const b = tr.getBoundingClientRect(); if (b.bottom < 0 || b.top > innerHeight) return;
    irPremio(atual + 1, true);
  }, 3800);
}

/* ---------- cartela (compartilhada) ---------- */
function celHTML(n, admin, mapa) {
  let st, extra = '';
  if (admin) {
    const v = mapa.get(n);
    st = v ? (v.pago ? 'pago' : 'aguardando') : (ui.sel.has(n) ? 'sel' : 'livre');
    if (v) extra = ', ' + (v.pago ? 'pago' : 'aguardando pagamento') + ', ' + (v.nome || '');
  } else {
    st = ui.sel.has(n) ? 'sel' : (ocupadosPub.has(n) ? 'ocupado' : 'livre');
  }
  const rot = 'Número ' + n + (st === 'ocupado' ? ', já tem dono' : st === 'sel' ? ', escolhido' : '') + extra;
  return '<button type="button" class="cel ' + st + (ui.destaque === n ? ' pisca' : '') + '" data-n="' + n + '" aria-pressed="' + (st === 'sel') + '" aria-label="' + esc(rot) + '"' + (st === 'ocupado' ? ' aria-disabled="true"' : '') + '>' + n + '</button>';
}
function renderGrade(admin) {
  const el = $('#area-grade'); if (!el) return;
  if (!BLOCOS.length) { el.innerHTML = '<p class="dica">Nenhum número configurado ainda.</p>'; return; }
  ui.bloco = Math.max(0, Math.min(ui.bloco, BLOCOS.length - 1));
  const b = BLOCOS[ui.bloco];
  const mapa = admin ? mapaVendas() : null;
  const chips = BLOCOS.map((bl, i) => {
    const lv = bl.nums.filter(n => !ocupadosPub.has(n)).length; const info = admin ? bl.nums.filter(n => mapa.has(n)).length + ' com dono' : (lv ? lv + ' livres' : 'esgotado');
    return '<button type="button" role="tab" class="bloco" data-bloco="' + i + '" aria-selected="' + (i === ui.bloco) + '"><span class="num">' + bl.ini + '–' + bl.fim + '</span><span class="bloco-info">' + info + '</span></button>';
  }).join('');
  const sc = el.querySelector('.blocos'); const scrollAntes = sc ? sc.scrollLeft : null;
  el.innerHTML =
    '<div class="blocos" role="tablist" aria-label="Blocos de números">' + chips + '</div>' +
    '<div class="grade-cab"><button type="button" class="btn peq icone" data-acao="bloco-ant" aria-label="Bloco anterior"' + (ui.bloco === 0 ? ' disabled' : '') + '>‹</button>' +
    '<span class="grade-titulo">Bloco <span class="num">' + b.ini + '</span> a <span class="num">' + b.fim + '</span></span>' +
    '<button type="button" class="btn peq icone" data-acao="bloco-prox" aria-label="Próximo bloco"' + (ui.bloco === BLOCOS.length - 1 ? ' disabled' : '') + '>›</button></div>' +
    '<div class="cartela">' + b.nums.map(n => celHTML(n, admin, mapa)).join('') + '</div>';
  const nsc = el.querySelector('.blocos'); const at = el.querySelector('.bloco[aria-selected="true"]');
  if (nsc && at) {
    if (scrollAntes != null) nsc.scrollLeft = scrollAntes;
    const esq = at.offsetLeft - nsc.offsetLeft, dir = esq + at.offsetWidth;
    if (esq < nsc.scrollLeft || dir > nsc.scrollLeft + nsc.clientWidth) nsc.scrollLeft = esq - 8;
  }
}
function atualizarCel(n) {
  const b = $('.cel[data-n="' + n + '"]'); if (!b) return;

function irPara(n) {
  const i = BLOCOS.findIndex(b => b.nums.includes(n));

function contas() {
  const mapa = mapaVendas(); let pagos = 0, aguard = 0;
  mapa.forEach((v, n) => { if (!UNI_SET.has(n)) return; if (v.pago) pagos++; else aguard++; });
  const recebido = vendas.filter(v => v.pago).reduce((s, v) => s + (v.numeros || []).length, 0) * cfg.preco;
  const areceber = vendas.filter(v => !v.pago).reduce((s, v) => s + (v.numeros || []).length, 0) * cfg.preco;
  const bilhetes = vendas.filter(v => v.pago && !v.bilhete).length;
  return { pagos, aguard, livres: UNI.length - pagos - aguard, recebido, areceber, bilhetes };
}

/* venda: nova / editar */
function lerNumeros(txt, soDoUniverso) {
  const achados = []; const re = /(\d{3,7})(?:\s*(?:-|–|a|até)\s*(\d{3,7}))?/g; let m;
  while ((m = re.exec(String(txt || '')))) {
    const a = Number(m[1]), b = m[2] ? Number(m[2]) : null;
    if (b != null && b > a && b - a <= 100 && UNI_SET.has(a) && UNI_SET.has(b)) { for (let n = a; n <= b; n++) achados.push(n); }
    else { achados.push(a); if (b != null) achados.push(b); }
  }
  let lista = Array.from(new Set(achados));
  if (soDoUniverso) lista = lista.filter(n => UNI_SET.has(n));
  return ordenar(lista);
}
function lerPedido(txt) {
  const nome = (String(txt).match(/nome\s*:\s*(.+)/i) || [])[1];
  return { nome: nome ? nome.trim() : '', numeros: lerNumeros(txt, true) };
}
function analisarNumeros(nums, idAtual) {
  const mapa = mapaVendas(); const fora = [], deOutro = [];
  nums.forEach(n => {
    if (!UNI_SET.has(n)) fora.push(n);
    else { const v = mapa.get(n); if (v && v.id !== idAtual) deOutro.push({ n, v }); }
  });
  return { fora, deOutro };
}

let salvando = false;
async function salvarVenda() {
  if (salvando) return;
  const erro = $('#v-erro');
  const mostrar = m => { erro.textContent = m; erro.hidden = false; };
  if (!caps.db || !vendasCarregadas) return mostrar('Suas vendas ainda não carregaram. Espere um pouco e tente de novo.');
  const nums = lerNumeros($('#v-numeros').value, false);
  const nome = $('#v-nome').value.trim();
  const a = analisarNumeros(nums, ui.vendaEdit);
  if (!nums.length) return mostrar('Coloque pelo menos um número.');
  if (a.fora.length) return mostrar(listaNums(a.fora) + plural(a.fora.length, ' não está', ' não estão') + ' nos seus blocos. Confira o número.');
  if (a.deOutro.length) return mostrar(a.deOutro.map(o => o.n + ' já é de ' + (o.v.nome || 'outra pessoa')).join('; ') + '. Escolha outro.');
  if (!nome) return mostrar('Escreva o nome do comprador.');
  const antiga = vendas.find(x => x.id === ui.vendaEdit);
  const agora = new Date().toISOString();
  const pago = $('#v-pago').checked;
  const doc = {
    nome, numeros: nums, telefone: soDigitos($('#v-tel').value), pago, bilhete: $('#v-bilhete').checked,
    obs: $('#v-obs').value.trim(), criadoEm: antiga ? (antiga.criadoEm || agora) : agora, atualizadoEm: agora,
    pagoEm: pago ? ((antiga && antiga.pagoEm) || agora) : null
  };
  salvando = true; $('#v-salvar').disabled = true;
  try {
    const col = caps.db.collection('vendas');
    const ref = antiga ? col.doc(antiga.id) : col.doc();
    await ref.set(doc);
    const mudouNumeros = !antiga || listaNums(antiga.numeros || []) !== listaNums(nums);
    fecharFolha();
    ui.sel.clear();
    if (ui.aba === 'numeros') renderGrade(true);
    renderBarra();
    toast(antiga ? 'Venda atualizada' : 'Venda de ' + primeiroNome(nome) + ' salva');
    if (mudouNumeros) agendarPublicacao();
  } catch (e) {
    mostrar(e && e.code === 'quota_exceeded' ? 'O caderno de vendas encheu. Me chama no Claude que eu resolvo.' : 'Não consegui salvar agora. Confira a internet e tente de novo.');
  } finally { salvando = false; const b = $('#v-salvar'); if (b) b.disabled = false; }
}
async function excluirVenda() {
  const v = vendas.find(x => x.id === ui.vendaEdit);
  if (!v || !caps.db) return;
  try { await caps.db.collection('vendas').doc(v.id).delete(); fecharFolha(); toast('Venda excluída. Os números ficaram livres.'); agendarPublicacao(); }
  catch (e) { toast('Não consegui excluir agora. Tente de novo.'); }
}
const ocupadoDoc = new Set();
async function atualizarVenda(id, campos, msg) {
  if (!caps.db || ocupadoDoc.has(id)) return;
  ocupadoDoc.add(id);
  try { await caps.db.collection('vendas').doc(id).update(Object.assign({ atualizadoEm: new Date().toISOString() }, campos)); toast(msg); }
  catch (e) { toast('Não consegui salvar agora. Tente de novo.'); }
  finally { ocupadoDoc.delete(id); }
}

  const novo = Object.assign({}, cfg, {
    vendedora: $('#a-vendedora').value.trim(), whatsapp: soDigitos($('#a-whatsapp').value),
    pixTipo: $('#a-pix-tipo').value, pixChave: $('#a-pix-chave').value.trim(), pixNome: $('#a-pix-nome').value.trim(), pixCidade: $('#a-pix-cidade').value.trim(),
    preco: lerPreco($('#a-preco').value), faixas: $('#a-faixas').value.trim(),
    titulo: $('#a-titulo').value.trim() || CFG_PADRAO.titulo,
    mostrarContador: $('#a-contador').checked, prazoReserva: Number($('#a-prazo').value) || 24, pronto: true
  });
  if (!novo.vendedora) return mostrar('Escreva seu nome.');
  const wd = soDigitos(novo.whatsapp);
  if (wd.length < 10 || wd.length > 13) return mostrar('Confira seu WhatsApp: coloque o DDD e o número.');
  if (!(novo.preco > 0)) return mostrar('Coloque o valor de cada número.');
  const r = lerFaixas(novo.faixas);
  if (r.erros.length || !r.nums.length) return mostrar('Confira seus números: escreva as faixas como 19201-19500.');
  if (!vendasCarregadas && caps.db) return mostrar('Suas vendas ainda estão carregando. Tente de novo em alguns segundos.');
  const novoSet = new Set(r.nums);
  const perdidos = Array.from(ocupadosAtuais()).filter(n => !novoSet.has(n));
  if (perdidos.length) return mostrar(plural(perdidos.length, 'O número ', 'Os números ') + listaNums(perdidos).slice(0, 80) + plural(perdidos.length, ' já foi vendido e ficaria', ' já foram vendidos e ficariam') + ' de fora. Exclua essas vendas antes ou inclua esses números.');
  $('#a-salvar').disabled = true;
  const ok = await publicar(novo, 'Ajustes salvos. A página dos compradores já foi atualizada.');
  if (!ok) { const b = $('#a-salvar'); if (b) b.disabled = false; }
}

/* ---------- publicação da página ---------- */
function montarDocumento(est) {
  const json = JSON.stringify(est).replace(/</g, '\\u003c').split(String.fromCharCode(0x2028)).join('\\u2028').split(String.fromCharCode(0x2029)).join('\\u2029');
  return PREFIXO + '\n' + CABECA +
    '<style id="css">' + $('#css').textContent + '</style><div id="app"></div>' +
    '<script id="midia" type="application/json">' + $('#midia').textContent + '<\/script>' +
    '<script id="estado" type="application/json">' + json + '<\/script>' +
    '<script id="programa">' + $('#programa').textContent + '<\/script>\n\n</body></html>';
}
async function publicar(cfgNovo, msg) {
  if (!caps.artifact) { toast('Não consegui atualizar a página nesta tela. Abra pelo app do Claude, na sua conta.'); return false; }
  if (ui.publicando) return false;
  const c = cfgNovo || cfg;
  const uni = new Set(lerFaixas(c.faixas).nums);
  const base = (caps.db && vendasCarregadas) ? ocupadosAtuais() : new Set(ocupadosPub);
  const est = { v: 1, cfg: c, ocupados: ordenar(base).filter(n => uni.has(n)), atualizado: new Date().toISOString() };
  ui.publicando = true; clearTimeout(timerPub); renderAvisos();
  try { sessionStorage.setItem('rifa-toast', msg || 'Página dos compradores atualizada'); sessionStorage.setItem('rifa-aba', ui.aba); } catch (e) { /* sem armazenamento */ }
  for (let tentativa = 0; tentativa < 2; tentativa++) {
    try { await caps.artifact.publish(montarDocumento(est)); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === 'upstream_error' && tentativa === 0) { await new Promise(r => setTimeout(r, 800 + Math.random() * 1200)); continue; }
      ui.publicando = false;
      try { sessionStorage.removeItem('rifa-toast'); } catch (e2) { /* nada */ }
      if (code === 'conflict') return false;
      if (code === 'rate_limited') toast('Muitas atualizações seguidas. Tente de novo daqui a um minuto.');
      else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled' || code === 'not_declared') toast('Esta tela não pode atualizar a página. Abra pelo app do Claude, na sua conta.');
      else toast('Não consegui atualizar a página agora. Tente de novo.');
      renderAvisos();
      return false;
    }
  }
  return false;
}
function agendarPublicacao() {
  mudouNestaSessao = true;
  clearTimeout(timerPub);
  timerPub = setTimeout(autoPublicar, 15000);
  renderAvisos();
}
function autoPublicar() {
  if (ui.folha || document.hidden || ui.publicando) { timerPub = setTimeout(autoPublicar, 8000); return; }
  if (pendentes() > 0) publicar(null, 'Página dos compradores atualizada');
}
document.addEventListener('pointerdown', () => { if (timerPub && mudouNestaSessao && !ui.publicando) { clearTimeout(timerPub); timerPub = setTimeout(autoPublicar, 15000); } }, true);

/* ---------- planilha ---------- */
async function baixarCSV() {
  if (!caps.downloads) { toast('Não dá pra baixar arquivos nesta tela.'); return; }
  const mapa = mapaVendas();
  const cel = s => { let t = String(s == null ? '' : s); if (/^[=+\-@]/.test(t)) t = "'" + t; return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const linhas = [['Número', 'Bloco', 'Comprador', 'Telefone', 'Situação', 'Bilhete enviado', 'Observação']];
  BLOCOS.forEach(b => b.nums.forEach(n => {
    const v = mapa.get(n);
    linhas.push([n, b.ini + ' a ' + b.fim, v ? v.nome : '', v && v.telefone ? foneBonito(v.telefone) : '', v ? (v.pago ? 'Pago' : 'Aguardando pagamento') : 'Livre', v ? (v.bilhete ? 'Sim' : 'Não') : '', v ? v.obs : '']);
  }));
  const csv = '﻿' + linhas.map(l => l.map(cel).join(';')).join('\r\n');
  const hoje = new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' }).split('/').reverse().join('-');
  try { const r = await caps.downloads.save({ filename: 'rifa-controle-' + hoje + '.csv', data: csv }); if (r && r.status === 'saved') toast('Planilha salva'); }
  catch (e) { if (!e || e.code !== 'declined') toast('Não consegui gerar a planilha agora.'); }
}

/* ---------- cliques ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'fundo') { fecharFolha(); return; }
  const t = e.target.closest('[data-n],[data-bloco],[data-acao],[data-copiar],[data-aba],[data-filtro],[data-ponto],[data-inserir]');
  if (!t) return;
  if (t.dataset.copiar != null) { copiar(t.dataset.copiar, t.dataset.alvo); return; }
  if (t.dataset.inserir) {
    const ta = document.getElementById(t.dataset.alvo); if (!ta) return;
    const usou = ta.dataset.mexeu === '1';
    const i0 = usou && ta.selectionStart != null ? ta.selectionStart : ta.value.length, i1 = usou && ta.selectionEnd != null ? ta.selectionEnd : i0;
    ta.value = ta.value.slice(0, i0) + t.dataset.inserir + ta.value.slice(i1);
    ta.focus(); ta.setSelectionRange(i0 + t.dataset.inserir.length, i0 + t.dataset.inserir.length);
    ta.dispatchEvent(new Event('input')); return;
  }
  if (t.dataset.n) { tocarNumero(Number(t.dataset.n)); return; }
  if (t.dataset.bloco) { ui.bloco = Number(t.dataset.bloco); renderGrade(ui.modo === 'admin'); return; }
  if (t.dataset.aba) { ui.aba = t.dataset.aba; if (ui.aba !== 'numeros') ui.sel.clear(); renderAba(); return; }
  if (t.dataset.filtro) { ui.filtro = t.dataset.filtro; renderLista(); return; }
  if (t.dataset.ponto) { if (irPremio) { pausarCarrossel(); irPremio(Number(t.dataset.ponto), true); } return; }
  const id = t.dataset.venda;
  switch (t.dataset.acao) {
    case 'bloco-ant': ui.bloco--; renderGrade(ui.modo === 'admin'); break;
    case 'bloco-prox': ui.bloco++; renderGrade(ui.modo === 'admin'); break;
    case 'sorte': escolherPraMim(); break;
    case 'prem-ant': if (irPremio) { pausarCarrossel(); irPremio(irPremio.atual() - 1, true); } break;
    case 'prem-prox': if (irPremio) { pausarCarrossel(); irPremio(irPremio.atual() + 1, true); } break;
    case 'ir-escolha': { const s = $('#escolha'); if (s) s.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); break; }
    case 'limpar-sel': { const ant = Array.from(ui.sel); ui.sel.clear(); ant.forEach(atualizarCel); renderBarra(); break; }
    case 'continuar': if (ui.modo === 'admin') abrirVenda(null, Array.from(ui.sel)); else abrirPedido(); break;
    case 'tirar': ui.sel.delete(Number(t.dataset.num)); atualizarCel(Number(t.dataset.num)); if (ui.sel.size) abrirPedido(); else fecharFolha(); break;
    case 'fechar': fecharFolha(); break;
    case 'compartilhar': abrirCompartilhar(); break;
    case 'ver-pub': ui.modo = 'publico'; ui.sel.clear(); window.scrollTo(0, 0); render(); break;
    case 'painel': ui.modo = 'admin'; ui.sel.clear(); window.scrollTo(0, 0); render(); break;
    case 'nova-venda': abrirVenda(null, []); break;
    case 'editar-venda': { const v = vendas.find(x => x.id === id); if (v) abrirVenda(v); break; }
    case 'marcar-pago': atualizarVenda(id, { pago: true, pagoEm: new Date().toISOString() }, 'Marcado como pago'); break;
    case 'marcar-bilhete': atualizarVenda(id, { bilhete: true }, 'Bilhete marcado como enviado'); break;
    case 'abriu-bilhete': toast('Depois de mandar as imagens, toque em “Já mandei o bilhete”.'); break;
    case 'excluir-venda': ui.confirmarExclusao = true; renderZonaExcluir(); break;
    case 'cancelar-exclusao': ui.confirmarExclusao = false; renderZonaExcluir(); break;
    case 'confirmar-exclusao': excluirVenda(); break;
    case 'publicar-agora':
      if (!vendasCarregadas) { toast('Espere suas vendas carregarem.'); break; }
      publicar(null, 'Página dos compradores atualizada'); break;
    case 'csv': baixarCSV(); break;
    case 'liberar': { const v = vendas.find(x => x.id === id); if (v) { abrirVenda(v); ui.confirmarExclusao = true; renderZonaExcluir(); const z = $('#zona-excluir'); if (z) z.scrollIntoView({ block: 'center' }); } break; }
    case 'ver-vencidas': ui.aba = 'vendas'; ui.filtro = 'vencidas'; renderAba(); { const l = $('#lista'); if (l) l.scrollIntoView({ block: 'start' }); } break;
    case 'msg-original': { const k = t.dataset.msg, ta = $('#m-' + k); if (ta) { ta.value = MSGS_PADRAO[k]; previaMsg(k); toast('Texto original de volta. Toque em Salvar mensagens pra valer.'); } break; }
  }
});
document.addEventListener('click', e => {
  const a = e.target.closest('#p-wa');
  if (!a) return;
  const nome = $('#p-nome');
  if (nome && !nome.value.trim()) { e.preventDefault(); $('#p-nome-erro').hidden = false; nome.focus(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'f-busca') return;
  e.preventDefault();
  const v = Number(soDigitos($('#busca-num').value));
  if (!v) return;
  if (!UNI_SET.has(v)) { toast('O ' + v + ' não está entre os meus números. Os meus são: ' + faixasTexto() + '.'); return; }
  irPara(v);
  if (ocupadosPub.has(v)) toast('O ' + v + ' já tem dono. Escolha outro.');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.folha) fecharFolha(); });

function tocarNumero(n) {
  if (ui.modo === 'admin') {
    const v = mapaVendas().get(n);
    if (v) { abrirVenda(v); return; }
  } else {
    if (ocupadosPub.has(n)) { toast('O ' + n + ' já tem dono. Escolha outro.'); return; }
    if (!cfg.pronto || vendasEncerradas()) return;
  }
  if (ui.sel.has(n)) ui.sel.delete(n); else ui.sel.add(n);
  atualizarCel(n); renderBarra();
}
function escolherPraMim() {
  const livres = UNI.filter(n => !estaOcupado(n) && !ui.sel.has(n));
  if (!livres.length) { toast('Não sobrou número livre.'); return; }
  const n = livres[Math.floor(Math.random() * livres.length)];
  ui.sel.add(n); irPara(n); renderBarra();
  toast('Separei o ' + n + ' pra você!');
}

/* ---------- vendas ao vivo ---------- */
setInterval(() => { if (ui.modo === 'admin' && !ui.folha && vendasCarregadas) { renderAvisos(); if (ui.aba === 'vendas') renderLista(); } }, 120000);
function aoMudarVendas() {
  if (ui.modo !== 'admin') return;
  renderAvisos(); renderResumo();
  if (ui.aba === 'vendas') renderLista();
  else if (ui.aba === 'numeros') renderGrade(true);
  if (ui.folha === 'venda') { const i = $('#v-numeros'); if (i) i.dispatchEvent(new Event('input')); renderZonaExcluir(); }
}
function render() {
  if (ui.modo === 'admin') renderAdmin(); else renderPublico();
  renderBarra();
}
async function conectar() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const user = await window.claude.use('user');
    const dona = user ? await user.isOwner() : false;
    if (!dona) return;
    ui.ehDona = true;
    const res = await Promise.all([window.claude.use('db'), window.claude.use('artifact'), window.claude.use('downloads')]);
    caps = { db: res[0], artifact: res[1], downloads: res[2] };
    let aba = null; try { aba = sessionStorage.getItem('rifa-aba'); sessionStorage.removeItem('rifa-aba'); } catch (e) { /* nada */ }
    ui.aba = !cfg.pronto ? 'ajustes' : (aba || ui.aba);
    ui.modo = 'admin'; ui.sel.clear();
    render();
    if (caps.db) {
      caps.db.collection('vendas').onSnapshot(snap => {
        vendas = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        if (!snap.metadata.fromCache) vendasCarregadas = true;
        erroVendas = '';
        aoMudarVendas();
      }, () => { erroVendas = 'Não consegui carregar suas vendas agora. Recarregue a página.'; renderAvisos(); renderResumo(); });
    } else {
      erroVendas = 'Seu caderno de vendas não abriu nesta tela. Abra a página pelo app do Claude, na sua conta.';
      renderAvisos(); renderResumo();
    }
  } catch (e) { /* segue como comprador */ }
}

/* ---------- versão publicada fora do Claude (GitHub Pages): busca o estado mais recente ---------- */
async function buscarEstadoExterno() {
  if (!/^https?:$/.test(location.protocol) || window.claude) return;
  try {
    const r = await fetch('estado.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const e = await r.json();
    if (!e || !e.cfg) return;
    cfg = Object.assign({}, CFG_PADRAO, e.cfg);
    ocupadosPub.clear(); (e.ocupados || []).forEach(n => ocupadosPub.add(Number(n)));
    atualizadoPub = e.atualizado || atualizadoPub;
    Array.from(ui.sel).forEach(n => { if (ocupadosPub.has(n)) ui.sel.delete(n); });
    definirUniverso();
    if (ui.modo === 'publico' && !ui.folha) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch (err) { /* segue com o estado embutido */ }
}

/* ---------- início ---------- */
criarCamadas();
render();
try { const m = sessionStorage.getItem('rifa-toast'); if (m) { sessionStorage.removeItem('rifa-toast'); setTimeout(() => toast(m), 400); } } catch (e) { /* nada */ }
let rz = null, larguraAntes = window.innerWidth; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (window.innerWidth !== larguraAntes) { larguraAntes = window.innerWidth; desenharRabiscos(); } }, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (ui.modo === 'publico') desenharRabiscos(); });
conectar();
buscarEstadoExterno();
})();
</script>
