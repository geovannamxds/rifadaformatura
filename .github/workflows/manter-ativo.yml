# Consulta a página pública a cada 2 dias pra o projeto gratuito do Supabase
# não ser pausado por falta de uso (ele pausa depois de 7 dias parado).
name: Manter o banco de dados acordado
on:
  schedule:
    - cron: '23 14 */2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta os números ocupados
        run: |
          URL=$(sed -n "s/^ *url: *'\([^']*\)'.*/\1/p" config.js)
          CHAVE=$(sed -n "s/^ *chave: *'\([^']*\)'.*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then echo "Supabase ainda não configurado"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/estado_publico" -H "apikey: $CHAVE" -H "Content-Type: application/json" -d '{}' -o /dev/null
          echo "Banco de dados respondeu."
